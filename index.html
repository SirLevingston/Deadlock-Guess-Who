<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess Who? - Deadlock Edition</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for Audio Effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    :root { 
      --ink: #173c41; 
      --cream: #f8f2e6; 
      --accent: #f5b94c; 
      --line: #c9d9d4; 
    }

    * { box-sizing: border-box; }

    body { 
      margin: 0; 
      font-family: "DM Sans", sans-serif; 
      color: var(--ink); 
      background-color: #eef4f2;
    }

    /* Interactive Card Base */
    .character-card { 
      position: relative; 
      display: flex;
      flex-direction: column;
      width: 100%; 
      padding: 6px; 
      border: 2px solid var(--line); 
      border-radius: 12px; 
      background: #fffdf8; 
      box-shadow: 0 4px 0 #b6cbc5; 
      cursor: pointer; 
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
      user-select: none;
    }

    .character-card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 8px 0 #9eb8b1; 
    }

    .character-card.edit-mode-active {
      border-color: #e99523;
      animation: pulse-edit 1.5s infinite;
    }

    @keyframes pulse-edit {
      0%, 100% { box-shadow: 0 0 0 0 rgba(233, 149, 35, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(233, 149, 35, 0); }
    }

    /* Eliminated Card State */
    .character-card[aria-pressed="true"] { 
      border-color: #d37a61; 
      box-shadow: 0 2px 0 #b8715e; 
      background: #f7ebe8;
      transform: translateY(2px) scale(0.97);
    }

    .portrait img { 
      transition: filter 0.25s ease, opacity 0.25s ease, transform 0.3s ease; 
    }

    .character-card[aria-pressed="true"] img { 
      filter: grayscale(1) contrast(0.7); 
      opacity: 0.25; 
      transform: scale(0.95);
    }

    /* Red Elimination Cross Overlay */
    .eliminated-mark { 
      position: absolute; 
      inset: 0; 
      display: grid; 
      place-items: center; 
      opacity: 0; 
      color: #c0392b; 
      font-family: "Fraunces", serif; 
      font-size: clamp(34px, 4vw, 65px); 
      font-weight: 800; 
      transform: scale(0.5) rotate(-10deg); 
      transition: opacity 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      pointer-events: none;
    }

    .character-card[aria-pressed="true"] .eliminated-mark { 
      opacity: 1; 
      transform: scale(1) rotate(0deg); 
    }

    .character-card[aria-pressed="true"] .slot-number {
      background: #e6d3cf;
      color: #8c4235;
      border-color: #d8b4ac;
      text-decoration: line-through;
    }

    /* Buttons */
    .btn-action { 
      background: var(--accent); 
      color: var(--ink); 
      transition: all 0.2s ease; 
    }
    
    .btn-action:hover { 
      background: #ffd16f; 
      transform: translateY(-2px); 
      box-shadow: 0 4px 12px rgba(245, 185, 76, 0.4);
    }

    /* Modal Backdrop */
    .modal-backdrop {
      background: rgba(23, 60, 65, 0.75);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="w-full min-h-screen flex flex-col">

  <!-- Header Section -->
  <header class="w-full px-5 py-6 md:px-10 md:py-7 bg-[#173c41]">
    <div class="mx-auto max-w-[1600px] flex flex-col md:flex-row items-center justify-between gap-5">
      <div class="text-center md:text-left">
        <p class="uppercase tracking-[.25em] font-extrabold text-xs mb-1 text-[#f5b94c]">
          DEADLOCK EDITION · 44 CHARACTERS
        </p>
        <h1 class="leading-tight text-3xl md:text-4xl font-extrabold text-[#fffdf8]" style="font-family: Fraunces, serif;">
          Guess Who? Board
        </h1>
        <p class="mt-1 text-sm font-medium text-[#d1e3dd]">
          Tap a character to eliminate or restore. Draw a secret mystery card or edit character details!
        </p>
      </div>

      <!-- Header Controls -->
      <div class="flex flex-wrap items-center justify-center gap-3">
        <!-- Draw Random Card -->
        <button id="draw-card-btn" class="btn-action rounded-full px-5 py-2.5 font-bold text-sm flex items-center gap-2 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          Draw Your Secret Card
        </button>

        <!-- Edit Card Mode -->
        <button id="toggle-edit-btn" class="bg-teal-800 text-teal-100 hover:bg-teal-700 rounded-full px-5 py-2.5 font-bold text-sm flex items-center gap-2 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
          <span id="edit-btn-text">Customize Board</span>
        </button>

        <!-- Reset Board Button -->
        <button id="reset-board-btn" class="bg-red-800/80 text-red-100 hover:bg-red-700 rounded-full px-5 py-2.5 font-bold text-sm flex items-center gap-2 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Reset Board
        </button>
      </div>
    </div>
  </header>

  <!-- Main Game Area -->
  <main class="w-full flex-grow px-3 py-6 sm:px-6 md:px-10">
    <div class="mx-auto max-w-[1600px]">
      
      <!-- Current Active Secret Card Banner -->
      <div id="active-secret-banner" class="mb-5 hidden items-center justify-between gap-4 bg-gradient-to-r from-amber-500/10 via-teal-500/10 to-amber-500/10 p-4 rounded-xl border-2 border-amber-400/60 shadow-sm">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 rounded-lg overflow-hidden border border-slate-300 shadow-sm shrink-0 bg-slate-100">
            <img id="active-secret-img" src="" alt="Your Secret Card" class="w-full h-full object-cover">
          </div>
          <div>
            <span class="text-[10px] font-black uppercase tracking-widest text-amber-700 block">Your Secret Character</span>
            <h2 id="active-secret-name" class="text-xl font-extrabold text-teal-950" style="font-family: Fraunces, serif;">-</h2>
          </div>
        </div>
        <button id="redraw-banner-btn" class="btn-action rounded-lg px-4 py-2 font-bold text-xs flex items-center gap-1.5 shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Draw New
        </button>
      </div>

      <!-- Stats & Search Bar -->
      <div class="mb-5 flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-6">
          <div>
            <span class="text-xs text-slate-500 font-bold uppercase tracking-wider block">Remaining</span>
            <span id="remaining-count" class="text-2xl font-black text-teal-800">44</span>
            <span class="text-sm font-semibold text-slate-400">/ 44</span>
          </div>
          <div class="h-8 w-px bg-slate-200"></div>
          <div>
            <span class="text-xs text-slate-500 font-bold uppercase tracking-wider block">Eliminated</span>
            <span id="eliminated-count" class="text-2xl font-black text-rose-600">0</span>
          </div>
        </div>

        <!-- Search / Filter Input -->
        <div class="w-full sm:w-72 relative">
          <input type="text" id="search-input" placeholder="Filter character..." class="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>

      <!-- Character Grid -->
      <div id="board-grid" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-7 lg:grid-cols-9 xl:grid-cols-11 gap-2.5" aria-label="Guess Who Character Board">
        <!-- Cards injected dynamically via JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-500 font-medium">
    Interactive Guess Who? Board · Deadlock Hero Lineup
  </footer>

  <!-- Secret Card Modal -->
  <div id="secret-card-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl border-4 border-amber-400 transform transition-all scale-95 opacity-0" id="secret-card-content">
      <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-1">Your Mystery Character</h3>
      <h2 id="secret-name" class="text-2xl font-black text-teal-900 mb-4" style="font-family: Fraunces, serif;">-</h2>
      <div class="w-48 h-48 mx-auto rounded-xl overflow-hidden border-2 border-slate-200 mb-5 shadow-inner bg-slate-100">
        <img id="secret-img" src="" alt="Secret Character" class="w-full h-full object-cover">
      </div>
      <button id="close-secret-btn" class="w-full btn-action py-3 rounded-xl font-extrabold text-sm shadow">
        Got It, Keep It Secret!
      </button>
    </div>
  </div>

  <!-- Custom Edit Card Modal -->
  <div id="edit-card-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-200">
      <h3 class="text-lg font-bold text-teal-900 mb-4">Edit Character</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Character Name</label>
          <input type="text" id="edit-name-input" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Image URL</label>
          <input type="text" id="edit-url-input" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none" placeholder="https://example.com/photo.jpg">
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button id="cancel-edit-btn" class="px-4 py-2 text-slate-600 font-bold text-sm hover:bg-slate-100 rounded-lg">Cancel</button>
        <button id="save-edit-btn" class="btn-action px-5 py-2 font-bold text-sm rounded-lg shadow">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- JavaScript App Code -->
  <script>
    // List of Deadlock characters. 
    // To add a new character: simply add { name: "Character Name" } or { name: "Character Name", img: "custom_path.jpg" } to this list!
    const DEADLOCK_HEROES = [
      { name: "Abrams", img: "Abrams_card.png" },
      { name: "Apollo", img: "Apollo_card.png" },
      { name: "Baba", img: "Baba_card.png" },
      { name: "Bebop", img: "Bebop_card.png" },
      { name: "Billy", img: "Billy_card.png" },
      { name: "Calico", img: "Calico_card.png" },
      { name: "Celeste", img: "Celeste_card.png" },
      { name: "Deadman Danny", img: "Deadman_Danny_card.png" },
      { name: "The Doorman", img: "The_Doorman_card.png" },
      { name: "Drifter", img: "Drifter_card.png" },
      { name: "Dynamo", img: "Dynamo_card.png" },
      { name: "Graves", img: "Graves_card.png" },
      { name: "Grey Talon", img: "Grey_Talon_card.png" },
      { name: "Haze", img: "Haze_card.png" },
      { name: "Holliday", img: "Holliday_card.png" },
      { name: "Infernus", img: "Infernus_card.png" },
      { name: "Ivy", img: "Ivy_card.png" },
      { name: "Kelvin", img: "Kelvin_card.png" },
      { name: "Lady Geist", img: "Lady_Geist_card.png" },
      { name: "Lash", img: "Lash_card.png" },
      { name: "McGinnis", img: "McGinnis_card.png" },
      { name: "Mina", img: "Mina_card.png" },
      { name: "Mirage", img: "Mirage_card.png" },
      { name: "Mo & Krill", img: "Mo_&_Krill_card.png" },
      { name: "Nurse Harrow", img: "Nurse_Harrow_card.png" },
      { name: "Paige", img: "Paige_card.png" },
      { name: "Paradox", img: "Paradox_card.png" },
      { name: "Pocket", img: "Pocket_card.png" },
      { name: "Rat King", img: "Rat_King_card.png" },
      { name: "Rem", img: "Rem_card.png" },
      { name: "Seven", img: "Seven_card.png" },
      { name: "Shiv", img: "Shiv_card.png" },
      { name: "Silver", img: "Silver_card.png" },
      { name: "Sinclair", img: "Sinclair_card.png" },
      { name: "Solomon", img: "Solomon_card.png" },
      { name: "Venator", img: "Venator_card.png" },
      { name: "Victor", img: "Victor_card.png" },
      { name: "Vindicta", img: "Vindicta_card.png" },
      { name: "Violet", img: "Violet_card.png" },
      { name: "Viscous", img: "Viscous_card.png" },
      { name: "Vyper", img: "Vyper_card.png" },
      { name: "Warden", img: "Warden_card.png" },
      { name: "Wraith", img: "Wraith_card.png" },
      { name: "Yamato", img: "Yamato_card.png" }
      // Example for adding a new hero:
      // { name: "New Hero Name", img: "New_Hero_card.png" }
      // or simply:
      // { name: "New Hero Name" } (defaults img to "New Hero Name_card.png")
    ];

    // Build the dataset dynamically
    let characters = DEADLOCK_HEROES.map((hero, index) => ({
      id: index + 1,
      name: hero.name,
      img: hero.img || `${hero.name.replace(/\s+/g, '_')}_card.png`
    }));

    let eliminatedSet = new Set();
    let isEditMode = false;
    let editingCardId = null;
    let activeSecretChar = null;

    // Tone.js Audio Synthesizer
    let synth = null;
    function playClickSound(isEliminating) {
      try {
        if (!synth && window.Tone) {
          synth = new Tone.MembraneSynth().toDestination();
          synth.volume.value = -12;
        }
        if (synth && Tone.context.state === 'running') {
          synth.triggerAttackRelease(isEliminating ? "C2" : "G3", "8n");
        }
      } catch (e) {
        // Continue silently if audio context is restricted
      }
    }

    // Helper for generating image placeholders
    function getFallbackImg(name) {
      return `https://placehold.co/400x400/173c41/f5b94c?text=${encodeURIComponent(name)}`;
    }

    // Render grid board
    function renderBoard() {
      const grid = document.getElementById("board-grid");
      const filterTerm = document.getElementById("search-input").value.toLowerCase().trim();
      
      grid.innerHTML = "";

      characters.forEach(char => {
        if (filterTerm && !char.name.toLowerCase().includes(filterTerm)) {
          return;
        }

        const isEliminated = eliminatedSet.has(char.id);
        const card = document.createElement("button");
        card.type = "button";
        card.className = `character-card ${isEditMode ? 'edit-mode-active' : ''}`;
        card.setAttribute("aria-label", char.name);
        card.setAttribute("aria-pressed", isEliminated ? "true" : "false");

        card.innerHTML = `
          <span class="portrait relative overflow-hidden w-full aspect-square rounded-lg bg-slate-200 block">
            <img src="${char.img}" alt="${char.name}" loading="lazy" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='${getFallbackImg(char.name)}';">
            <span class="eliminated-mark" aria-hidden="true">×</span>
          </span>
          <span class="slot-number mt-1.5 py-1 px-0.5 text-center font-bold text-[10px] sm:text-xs bg-[#f8f2e6] text-[#173c41] border border-[#c9d9d4] rounded-md truncate block" aria-hidden="true">${char.name}</span>
        `;

        card.addEventListener("click", () => handleCardClick(char.id));
        grid.appendChild(card);
      });

      updateStats();
    }

    // Handle Toggling Cards or Opening Edit Modal
    function handleCardClick(id) {
      if (window.Tone && Tone.context.state !== 'running') {
        Tone.start();
      }

      if (isEditMode) {
        openEditModal(id);
      } else {
        const newlyEliminated = !eliminatedSet.has(id);
        if (newlyEliminated) {
          eliminatedSet.add(id);
        } else {
          eliminatedSet.delete(id);
        }
        playClickSound(newlyEliminated);
        renderBoard();
      }
    }

    // Update Counter Numbers
    function updateStats() {
      const remainingCount = characters.length - eliminatedSet.size;
      document.getElementById("remaining-count").textContent = remainingCount;
      document.getElementById("eliminated-count").textContent = eliminatedSet.size;
      
      // Update header subtitle total character count automatically
      const headerTotal = document.querySelector("header p");
      if (headerTotal) {
        headerTotal.textContent = `DEADLOCK EDITION · ${characters.length} CHARACTERS`;
      }
    }

    // Draw Secret Mystery Character Modal
    function drawSecretCard() {
      const randomChar = characters[Math.floor(Math.random() * characters.length)];
      setActiveSecretCard(randomChar);

      document.getElementById("secret-name").textContent = randomChar.name;
      const secretImg = document.getElementById("secret-img");
      secretImg.src = randomChar.img;
      secretImg.onerror = () => {
        secretImg.src = getFallbackImg(randomChar.name);
      };

      const modal = document.getElementById("secret-card-modal");
      const content = document.getElementById("secret-card-content");
      modal.classList.remove("hidden");
      setTimeout(() => {
        content.classList.remove("scale-95", "opacity-0");
        content.classList.add("scale-100", "opacity-100");
      }, 10);
    }

    document.getElementById("draw-card-btn").addEventListener("click", drawSecretCard);
    document.getElementById("redraw-banner-btn").addEventListener("click", drawSecretCard);

    document.getElementById("close-secret-btn").addEventListener("click", () => {
      const modal = document.getElementById("secret-card-modal");
      const content = document.getElementById("secret-card-content");
      content.classList.remove("scale-100", "opacity-100");
      content.classList.add("scale-95", "opacity-0");
      setTimeout(() => modal.classList.add("hidden"), 150);
    });

    // Reset Board State
    document.getElementById("reset-board-btn").addEventListener("click", () => {
      eliminatedSet.clear();
      document.getElementById("search-input").value = "";
      setActiveSecretCard(null);
      renderBoard();
    });

    // Toggle Customization Mode
    document.getElementById("toggle-edit-btn").addEventListener("click", () => {
      isEditMode = !isEditMode;
      const btnText = document.getElementById("edit-btn-text");
      const btn = document.getElementById("toggle-edit-btn");
      
      if (isEditMode) {
        btnText.textContent = "Done Customizing";
        btn.classList.remove("bg-teal-800", "text-teal-100");
        btn.classList.add("bg-amber-400", "text-teal-950");
      } else {
        btnText.textContent = "Customize Board";
        btn.classList.remove("bg-amber-400", "text-teal-950");
        btn.classList.add("bg-teal-800", "text-teal-100");
      }
      renderBoard();
    });

    // Edit Modal Functions
    function openEditModal(id) {
      editingCardId = id;
      const char = characters.find(c => c.id === id);
      if (!char) return;

      document.getElementById("edit-name-input").value = char.name;
      document.getElementById("edit-url-input").value = char.img;
      document.getElementById("edit-card-modal").classList.remove("hidden");
    }

    document.getElementById("cancel-edit-btn").addEventListener("click", () => {
      document.getElementById("edit-card-modal").classList.add("hidden");
      editingCardId = null;
    });

    document.getElementById("save-edit-btn").addEventListener("click", () => {
      if (!editingCardId) return;
      const newName = document.getElementById("edit-name-input").value.trim();
      const newUrl = document.getElementById("edit-url-input").value.trim();

      characters = characters.map(char => {
        if (char.id === editingCardId) {
          const updated = {
            ...char,
            name: newName || char.name,
            img: newUrl || char.img
          };
          if (activeSecretChar && activeSecretChar.id === char.id) {
            setActiveSecretCard(updated);
          }
          return updated;
        }
        return char;
      });

      document.getElementById("edit-card-modal").classList.add("hidden");
      editingCardId = null;
      renderBoard();
    });

    // Realtime Search Filter Event Listener
    document.getElementById("search-input").addEventListener("input", renderBoard);

    // Initial Setup
    window.onload = () => {
      renderBoard();
    };
  </script>
</body>
</html>
